name: CI

on:
  push:
    branches-ignore: [main]
    paths-ignore: ['k8s/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Consent-layer bundle budget and "no consent chunk in any prerendered
      # page" (spec 100 §3.10, #153); needs the build, skipped in `pnpm test`.
      - name: Consent bundle budget (#153)
        run: pnpm vitest run src/lib/analytics/bundle.test.ts
        env:
          ANALYTICS_BUNDLE_CHECK: '1'
      # The contact address must reach visitors only through the browser
      # (#147), never the server HTML, the RSC payload or the client chunks.
      # The patterns keep the literal out of the repo. grep exits 1 when
      # nothing matches; a match (0) or an error (2) fails the step.
      - name: Contact address absent from build output (#147)
        run: |
          rc=0
          grep -rIil --exclude-dir=cache -e 'dominic[@]furchert' -e 'dominic \[at\] furchert' \
            .next/server .next/static || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::contact address in the build output, or grep failed (exit $rc)"
            exit 1
          fi

  # Every `uses:` must be a local action, `owner/repo[/path]@<full 40-hex
  # commit SHA>` or `docker://…@sha256:<digest>`; tags, branches and short
  # SHAs fail. The check parses the workflow YAML
  # (.github/scripts/check_action_pins.py, the same script as the sibling
  # repos), so block, flow and quoted `uses` keys all count and comments can
  # neither hide nor satisfy a reference. Runs with the runner's python3 and
  # its system PyYAML; nothing is installed.
  pin-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test the pin check
        run: python3 .github/scripts/check_action_pins.py --self-test
      - name: Require full-SHA or digest pins
        run: |
          set -euo pipefail
          shopt -s nullglob
          python3 .github/scripts/check_action_pins.py .github/workflows/*.yml .github/workflows/*.yaml

  # Builds the container image (amd64 only, never pushed) and smoke-tests
  # /api/health, so Dockerfile and base-image bumps fail on the PR instead of
  # on main, where a failed leg silently blocks the rollout (#118).
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Same pinned BuildKit image as build.yml. Keep in sync.
          driver-opts: image=docker.io/moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          # Same registry mirror as build.yml (#118). Keep in sync.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        timeout-minutes: 15
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: furchert-ch:ci
          # Read-only reuse of main's amd64 layer cache; PRs never write it.
          cache-from: type=gha,scope=build-linux-amd64
      - name: Smoke-test /api/health
        run: |
          docker run -d --name furchert-ch -p 3000:3000 furchert-ch:ci
          for _ in $(seq 1 30); do
            if body=$(curl -fsS --max-time 5 http://127.0.0.1:3000/api/health 2>/dev/null) \
              && [ "$body" = '{"status":"ok"}' ]; then
              echo "health: $body"
              exit 0
            fi
            sleep 2
          done
          echo "Container did not report healthy within 60 s" >&2
          docker logs furchert-ch >&2
          exit 1
