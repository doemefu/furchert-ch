name: Build and Push

on:
  push:
    branches: [main, ci/48-native-arm64-runners]
    paths-ignore: ['k8s/**']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: doemefu/furchert-ch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      # Computed once per run so both platform builds and the merge job share
      # the identical main-<ts> value (Flux ImagePolicy: ^main-[0-9]{8}T[0-9]{6}$).
      ts: ${{ steps.ts.outputs.ts }}
    steps:
      - id: ts
        run: echo "ts=$(date -u +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  build:
    name: build (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Native builds (no QEMU). Job timeout stays >= 5 min above the build
    # step's own timeout below (checkout/buildx/login/metadata/upload add <1 min).
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Keep in sync with the merge job: here only the OCI labels are used.
          tags: |
            type=sha,prefix=
            type=raw,value=main-${{ needs.verify.outputs.ts }},enable={{is_default_branch}}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        timeout-minutes: 20
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=build-${{ env.PLATFORM_PAIR }},mode=max
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Runs only when every matrix leg succeeded, so a tag is never published
    # for a single-platform image.
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Same tag set as before #48: short sha + main-<UTC ts> (default branch only).
          tags: |
            type=sha,prefix=
            type=raw,value=main-${{ needs.verify.outputs.ts }},enable={{is_default_branch}}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        env:
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ "${#tags[@]}" -lt 1 ]; then
            echo "No tags from docker/metadata-action" >&2
            exit 1
          fi
          tag_args=()
          for tag in "${tags[@]}"; do
            if [ -z "$tag" ]; then
              echo "Empty tag from docker/metadata-action" >&2
              exit 1
            fi
            tag_args+=(-t "$tag")
          done
          if [ "$IS_DEFAULT_BRANCH" = "true" ] \
            && ! printf '%s\n' "${tags[@]}" | grep -Eq ':main-[0-9]{8}T[0-9]{6}$'; then
            echo "main-<ts> tag missing on the default branch" >&2
            exit 1
          fi
          sources=()
          for digest in *; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Unexpected digest file name: $digest" >&2
              exit 1
            fi
            sources+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}")
          done
          # One digest per entry in the build job's matrix.include (2 platforms);
          # refuse to publish a partial manifest list.
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "Expected 2 platform digests, got ${#sources[@]}" >&2
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
      - name: Verify both platforms in the manifest list
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ref="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          docker buildx imagetools inspect "$ref"
          # Attestation manifests appear as unknown/unknown and are ignored.
          platforms=$(docker buildx imagetools inspect --raw "$ref" \
            | jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | join(",")')
          echo "Platforms: $platforms"
          if [ "$platforms" != "linux/amd64,linux/arm64" ]; then
            echo "Expected linux/amd64,linux/arm64 in $ref" >&2
            exit 1
          fi
