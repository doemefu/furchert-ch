name: Build and Push

on:
  push:
    branches: [main]
    paths-ignore: ['k8s/**']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: doemefu/furchert-ch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      # Computed once per run so both platform builds and the merge job share
      # the identical main-<ts> value (Flux ImagePolicy: ^main-[0-9]{8}T[0-9]{6}$).
      ts: ${{ steps.ts.outputs.ts }}
    steps:
      - id: ts
        run: echo "ts=$(date -u +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  build:
    name: build (${{ matrix.platform }})
    # Branch guard: images are pushed only from main, whatever the trigger.
    if: github.ref == 'refs/heads/main'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Native builds (no QEMU). Job timeout stays >= 5 min above the build
    # step's own timeout below (checkout/buildx/login/metadata/upload add <1 min).
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The BuildKit image the builder runs is pinned by tag + index digest
          # (Dependabot does not track it; bump tag and digest together by hand,
          # in every setup-buildx step of build.yml and ci.yml).
          driver-opts: image=docker.io/moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          # Pull docker.io content (the digest-pinned node base, the Dockerfile
          # syntax frontend) through Google's Docker Hub mirror first; BuildKit
          # falls back to docker.io. Anonymous ECR Public / Docker Hub pulls
          # from shared runners hit 429 (#118). Keep in sync with ci.yml.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Keep in sync with the merge job: here only the OCI labels are used.
          tags: |
            type=sha,prefix=
            type=raw,value=main-${{ needs.verify.outputs.ts }},enable={{is_default_branch}}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        timeout-minutes: 20
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=build-${{ env.PLATFORM_PAIR }},mode=max
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Runs only when every matrix leg succeeded, so a tag is never published
    # for a single-platform image. Same branch guard as the build job.
    if: github.ref == 'refs/heads/main'
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Same pinned BuildKit image as the build job. Keep in sync.
          driver-opts: image=docker.io/moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Same tag set as before #48: short sha + main-<UTC ts> (default branch only).
          tags: |
            type=sha,prefix=
            type=raw,value=main-${{ needs.verify.outputs.ts }},enable={{is_default_branch}}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        env:
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ "${#tags[@]}" -lt 1 ]; then
            echo "No tags from docker/metadata-action" >&2
            exit 1
          fi
          tag_args=()
          for tag in "${tags[@]}"; do
            if [ -z "$tag" ]; then
              echo "Empty tag from docker/metadata-action" >&2
              exit 1
            fi
            tag_args+=(-t "$tag")
          done
          if [ "$IS_DEFAULT_BRANCH" = "true" ] \
            && ! printf '%s\n' "${tags[@]}" | grep -Eq ':main-[0-9]{8}T[0-9]{6}$'; then
            echo "main-<ts> tag missing on the default branch" >&2
            exit 1
          fi
          sources=()
          for digest in *; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Unexpected digest file name: $digest" >&2
              exit 1
            fi
            sources+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}")
          done
          # One digest per entry in the build job's matrix.include (2 platforms);
          # refuse to publish a partial manifest list.
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "Expected 2 platform digests, got ${#sources[@]}" >&2
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
      - name: Verify both platforms in the manifest list
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ref="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          docker buildx imagetools inspect "$ref"
          # Attestation manifests appear as unknown/unknown and are ignored.
          platforms=$(docker buildx imagetools inspect --raw "$ref" \
            | jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | join(",")')
          echo "Platforms: $platforms"
          if [ "$platforms" != "linux/amd64,linux/arm64" ]; then
            echo "Expected linux/amd64,linux/arm64 in $ref" >&2
            exit 1
          fi
