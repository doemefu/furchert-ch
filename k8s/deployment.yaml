apiVersion: apps/v1
kind: Deployment
metadata:
  name: furchert-ch
  namespace: apps
  labels:
    app: furchert-ch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: furchert-ch
  template:
    metadata:
      labels:
        app: furchert-ch
    spec:
      automountServiceAccountToken: false
      containers:
        - name: furchert-ch
          # Image tag is managed by Flux CD image automation.
          image: ghcr.io/doemefu/furchert-ch:main-20260924T095618 # {"$imagepolicy": "flux-system:furchert-ch"}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: OIDC_ISSUER
              value: "https://auth.furchert.ch"
            - name: OIDC_CLIENT_ID
              value: "furchert-ch"
            - name: AUTH_URL
              value: "https://furchert.ch"
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
            # /dashboard/network (NM-1, #61): data-service read API + the
            # auth-service token endpoint for the client-credentials grant.
            # Plain values; the grant reuses OIDC_CLIENT_ID/OIDC_CLIENT_SECRET.
            - name: DATA_SERVICE_URL
              value: "http://data-service.apps.svc.cluster.local:8082"
            - name: DATA_SERVICE_TOKEN_URL
              value: "http://auth-service.apps.svc.cluster.local:8080/oauth2/token"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: furchert-ch-secrets
                  key: oidc-client-secret
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: furchert-ch-secrets
                  key: auth-secret
            # SMTP delivery for the contact form (#46). SMTP_PASSWORD requires
            # `furchert-ch-secrets` to carry key `smtp-password` — apply the
            # infrastructure playbook (59_app_services.yml) before this manifest.
            - name: SMTP_HOST
              value: "mail.infomaniak.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USER
              value: "info@furchert.ch"
            - name: CONTACT_TO
              value: "info@furchert.ch"
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: furchert-ch-secrets
                  key: smtp-password
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: furchert-ch
  namespace: apps
spec:
  selector:
    app: furchert-ch
  ports:
    - port: 3000
      targetPort: 3000
